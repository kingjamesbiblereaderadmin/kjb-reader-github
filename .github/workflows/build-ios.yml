name: Build iOS App
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '16.1' }
      - name: Install deps
        run: npm install
      - name: Build web + sync
        run: npm run build && npx cap sync ios
      - name: Install pods
        run: cd ios/App && pod install
      - name: Write signing key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          if printf '%s' "$ASC_KEY_P8" | head -c 5 | grep -q 'BEGIN'; then
            printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          else
            printf '%s' "$ASC_KEY_P8" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          fi
          jq -n --arg key_id "$ASC_KEY_ID" --arg issuer "$ASC_ISSUER_ID" \
            --rawfile p8 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            '{key_id:$key_id, issuer_id:$issuer, key:$p8, in_house:false}' > ios/ci/asc_key_runtime.json
      # Development signing cannot work here: the account has no registered
      # devices, so xcodebuild cannot mint a development profile ("Your team
      # has no devices..."). Archive unsigned instead; the export step below
      # signs with an Apple Distribution certificate + App Store profile
      # created via the App Store Connect API key (-allowProvisioningUpdates).
      - name: Archive (unsigned)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Export IPA (signs with Apple Distribution)
        run: |
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist ios/ci/ExportOptions.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}
      - name: Upload to App Store Connect
        run: fastlane deliver --api_key_path ios/ci/asc_key_runtime.json --ipa build/ipa/App.ipa --skip_screenshots --skip_metadata
