name: Build iOS App
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '16.1' }
      - name: Install deps
        run: npm install
      - name: Build web + sync
        run: npm run build && npx cap sync ios
      - name: Install pods
        run: cd ios/App && pod install
      - name: Write signing key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          if printf '%s' "$ASC_KEY_P8" | head -c 5 | grep -q 'BEGIN'; then
            printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          else
            printf '%s' "$ASC_KEY_P8" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          fi
          jq -n --arg key_id "$ASC_KEY_ID" --arg issuer "$ASC_ISSUER_ID" \
            --rawfile p8 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            '{key_id:$key_id, issuer_id:$issuer, key:$p8, in_house:false}' > ios/ci/asc_key_runtime.json
      # Development signing cannot work here (no registered devices on the
      # account), and `xcodebuild archive` with CODE_SIGNING_ALLOWED=NO does a
      # plain build without creating an .xcarchive. So: build unsigned into a
      # known DerivedData path, then assemble the .xcarchive by hand. The export
      # step below re-signs it with an Apple Distribution certificate + App
      # Store profile created via the ASC API key (-allowProvisioningUpdates).
      - name: Build (unsigned) and assemble xcarchive
        run: |
          set -euxo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          APP=build/derived/Build/Products/Release-iphoneos/App.app
          VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          mkdir -p build/App.xcarchive/Products/Applications
          cp -R "$APP" build/App.xcarchive/Products/Applications/
          cat > build/App.xcarchive/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>ApplicationProperties</key>
            <dict>
              <key>ApplicationPath</key><string>Applications/App.app</string>
              <key>CFBundleIdentifier</key><string>com.kingjamesbiblereader.twa</string>
              <key>CFBundleShortVersionString</key><string>$VER</string>
              <key>CFBundleVersion</key><string>$BUILD</string>
              <key>SigningIdentity</key><string></string>
              <key>Team</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            </dict>
            <key>ArchiveVersion</key><integer>2</integer>
            <key>CreationDate</key><date>$(date -u +%Y-%m-%dT%H:%M:%SZ)</date>
            <key>Name</key><string>App</string>
            <key>SchemeName</key><string>App</string>
            <key>Project</key><dict><key>Name</key><string>App</string></dict>
          </dict>
          </plist>
          EOF
          find build/App.xcarchive -maxdepth 3
      - name: Generate export options (with team ID)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed 's|</dict>|<key>teamID</key><string>'"$APPLE_TEAM_ID"'</string></dict>|' ios/ci/ExportOptions.plist > ios/ci/ExportOptions-runtime.plist
          plutil -lint ios/ci/ExportOptions-runtime.plist
      - name: Export IPA (signs with Apple Distribution)
        run: |
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist ios/ci/ExportOptions-runtime.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
      - name: Upload to App Store Connect
        run: fastlane deliver --api_key_path ios/ci/asc_key_runtime.json --ipa build/ipa/App.ipa --skip_screenshots --skip_metadata
