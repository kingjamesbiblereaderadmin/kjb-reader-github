name: ASC Rename (one-off)

# Temporary: renames the editable App Store Connect version record to the
# version the in-flight Apple build is shipping. Deleted right after it runs.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install --quiet pyjwt requests cryptography
      - name: Resolve the release build number
        id: relbuild
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          BUILD=$(python3 scripts/asc-next-build.py)
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Release build number: $BUILD"
      - name: Resolve the marketing version
        id: relver
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          REQUESTED: ${{ format('2.{0}', steps.relbuild.outputs.build) }}
        run: |
          set -euo pipefail
          V=$(python3 scripts/asc-next-version.py --app 6813352869 --platform all --requested "$REQUESTED")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Marketing version: $V"
      - name: Rename the editable ASC version record
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TARGET: ${{ steps.relver.outputs.version }}
        run: |
          set -o pipefail
          python3 scripts/asc-rename-version.py --app 6813352869 --platform all --to "$TARGET" | tee -a "$GITHUB_STEP_SUMMARY"
