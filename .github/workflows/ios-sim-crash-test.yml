name: iOS Simulator Crash Test

# Builds the app for the iOS Simulator (unsigned, Debug), installs it on a
# booted iPhone simulator, launches it, and dumps any crash logs — used to
# reproduce/diagnose App Store launch crashes without a physical device.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit to test (blank = branch HEAD)'
        required: false
        default: ''
        type: string

jobs:
  sim:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Select Xcode 27.0 (GM)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Install deps
        run: npm install
      - name: Build web + sync
        run: npm run build && npx cap sync ios
      - name: Prepare iOS offline bundle
        run: node scripts/prepare-ios-offline.js
      - name: Install pods
        run: cd ios/App && pod install
      - name: Pick a simulator
        id: sim
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available | grep -A20 "iOS" | grep "(booted)" | head -1 | grep -oE '[0-9A-F-]{36}' || true)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE '[0-9A-F-]{36}')
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
      - name: Build for simulator
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Debug -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -40
      - name: Install and launch
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find build/sim/Build/Products -name "*.app" | head -1)
          echo "APP=$APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.kingjamesbiblereader.twa || echo "LAUNCH FAILED"
          sleep 25
          echo "--- process check ---"
          xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -i kingjames || echo "PROCESS NOT RUNNING"
      - name: Dump crash logs
        if: always()
        run: |
          sleep 3
          mkdir -p art && cp -R ~/Library/Logs/DiagnosticReports art/ 2>/dev/null || true
          ls -la art/DiagnosticReports 2>/dev/null || echo "no DiagnosticReports"
          find art -name "*.ips" -exec sh -c 'echo "==== {} ===="; head -c 4000 "{}"' \;
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-crash-logs
          path: art
          if-no-files-found: ignore
