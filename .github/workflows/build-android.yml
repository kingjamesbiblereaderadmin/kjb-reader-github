name: Build Android
on:
  workflow_dispatch:
    inputs:
      play_track:
        description: 'Upload the AAB to Google Play (needs the PLAY_SERVICE_ACCOUNT_JSON secret)'
        type: choice
        options: [none, internal, alpha, beta, production]
        default: production
      play_status:
        description: 'Release status when uploading: completed sends it to Google review, draft leaves it unpublished'
        type: choice
        options: [completed, draft]
        default: completed
      release_notes:
        description: 'Play release notes (What''s New) for this upload; blank = leave unchanged. Write \n for line breaks. Max 500 chars.'
        required: false
        default: ''
        type: string
      release_notes_locale:
        description: 'Play locale for the release notes'
        required: false
        default: 'en-GB'
        type: string
jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Stamp build date (shown in Settings -> Last Updated)
        run: echo "KJB_BUILD_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      - name: Set automatic version from GitHub run number
        run: |
          set -euo pipefail
          GRADLE_FILE=android/app/build.gradle
          VERSION_CODE="$GITHUB_RUN_NUMBER"
          VERSION_NAME="2.$GITHUB_RUN_NUMBER"
          export VERSION_NAME
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          sed -i -E "s/^([[:space:]]*versionCode )[0-9]+/\1$VERSION_CODE/" "$GRADLE_FILE"
          python3 - <<'PYVER'
          import os, re
          path = "android/app/build.gradle"
          text = open(path).read()
          text = re.sub(r'^(\s*versionName )"[^"]*"', r'\g<1>"' + os.environ["VERSION_NAME"] + '"', text, flags=re.MULTILINE)
          open(path, "w").write(text)
          PYVER
          echo "Automatic Android version: $VERSION_NAME ($VERSION_CODE)"
          grep -E '^[[:space:]]*version(Code|Name) ' "$GRADLE_FILE"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Build web app (bundled into the APK as an offline fallback)
        run: |
          # server.url still makes the app load the LIVE site whenever there's
          # a connection (see capacitor.config.ts) -- this build only exists so
          # cap sync below has something to copy into the APK as a fallback for
          # when there's no connectivity at all. Website updates still don't
          # need an app rebuild for the normal (online) case.
          npm run build
      - name: Sync Capacitor Android (regenerates gitignored native plugin files)
        run: |
          # android/app/src/main/assets is entirely gitignored (public/, capacitor.config.json,
          # capacitor.plugins.json), so a fresh checkout doesn't have the directory at all —
          # cap sync's copy step can't write into a path that doesn't exist yet.
          mkdir -p android/app/src/main/assets
          npx cap sync android
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Cache persistence was disabled earlier while misdiagnosing the
          # jars-9/bcprov failure as cache corruption -- it was actually a
          # Gradle 8.2.1 / AGP 8.11.1 version mismatch (see the build step
          # below). Re-enabled now that Gradle is on a compatible version.
          cache-disabled: false
      - name: Kill any stale Gradle daemons
        run: |
          if [ -f android/gradlew ]; then
            android/gradlew --stop || true
          fi
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
      - name: Generate Gradle wrapper (if missing)
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            echo "No gradlew found — generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.13
          fi
          chmod +x gradlew || true
      - name: Restore persistent release keystore
        run: |
          # Decode the real, persistent signing key from a repo secret instead
          # of generating a throwaway one. This MUST be the same key used for
          # the first Play Store upload, or every update after that is
          # rejected. Add it via: base64 -w0 release.keystore, saved as the
          # ANDROID_KEYSTORE_BASE64 secret.
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$ANDROID_KEYSTORE_PATH"
      - name: Fetch Listen audio into the Play asset packs
        # 66 per-book archives (~1.5 GB) unpack into android/audio-pack-{1,2},
        # which only exist for this build (KJB_AUDIO_PACKS=1 below). Play
        # delivers them as fast-follow packs, so the clips land on the device
        # without the user waiting through a 1.5 GB install.
        env:
          AUDIO_RELEASE_TOKEN: ${{ secrets.AUDIO_RELEASE_TOKEN }}
        run: node scripts/fetch-audio-bundle.js android

      - name: Build signed release (APK + AAB)
        working-directory: android
        env:
          KJB_AUDIO_PACKS: '1'
        run: |
          # The "Failed to create Jar file .../jars-9/.../bcprov-*.jar"
          # ("Unsupported class file major version 65") seen here previously
          # was Gradle 8.2.1 unable to parse Java-21 multi-release classes
          # pulled in by AGP 8.11.1, which requires Gradle 8.13+ (see
          # gradle-wrapper.properties). Real fix was the Gradle version bump;
          # the retry below is just a cheap safety net for any other
          # transient CI flakiness, not a fix for that specific error.
          n=0
          until [ $n -ge 3 ]; do
            ./gradlew --stacktrace assembleRelease bundleRelease && break
            n=$((n+1))
            echo "Build attempt $n failed, retrying..."
            ./gradlew --stop || true
            sleep 5
          done
          if [ $n -ge 3 ]; then
            echo "Build failed after 3 attempts"
            exit 1
          fi
      - name: Verify the AAB carries the Listen audio
        # A missing or short pack would ship silent verses, so fail instead.
        working-directory: android
        run: |
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          N=$(unzip -l "$AAB" | grep -c 'assets/audio/.*\.mp3$' || true)
          P=$(unzip -l "$AAB" | grep -c 'assets.pb$' || true)
          NOTES=$(unzip -l "$AAB" | grep -c "assets/audio/.*_[A-Za-z][A-Za-z0-9]*\.mp3$" || true)

          echo "audio clips in $AAB: $N ($NOTES chapter notes, pack descriptors: $P)"

          # 31,102 verses plus the chapter's printed notes.

          test "$N" -ge 31102

          test "$NOTES" -ge 200

      - name: Rename outputs to kjbreader
        working-directory: android
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/kjbreader.apk
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/kjbreader.aab
      - name: Verify signature
        working-directory: android
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose app/build/outputs/apk/release/kjbreader.apk
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/kjbreader.apk
      - name: Publish to Google Play
        # Owner-driven only: runs when play_track names a track and the service
        # account secret exists. The AAB carries the fast-follow asset packs, so
        # the same upload delivers the Listen audio.
        if: ${{ inputs.play_track != 'none' && inputs.play_track != '' }}
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "PLAY_SERVICE_ACCOUNT_JSON is not set; skipping Play upload" >&2
            exit 1
          fi
          printf '%s' "$PLAY_JSON" > "$RUNNER_TEMP/play.json"
      - name: Resolve Play deobfuscation files
        # minifyEnabled is false in android/app/build.gradle, so release builds
        # produce no R8 mapping.txt and passing the path makes the action warn
        # "Unable to find 'mappingFile'". Resolve it only when it really exists.
        if: ${{ inputs.play_track != 'none' && inputs.play_track != '' }}
        id: deobf
        run: |
          M=android/app/build/outputs/mapping/release/mapping.txt
          if [ -f "$M" ]; then
            echo "mapping=$M" >> "$GITHUB_OUTPUT"
            echo "Using mapping file: $M"
          else
            echo "mapping=" >> "$GITHUB_OUTPUT"
            echo "No R8 mapping file (minifyEnabled is off); uploading without one."
          fi
      - name: Prepare Play release notes
        # The action reads a directory of files named whatsnew-<locale>, so a
        # dispatch input (single line) is written out as one localized file.
        # Play caps release notes at 500 characters per locale, so an overlong
        # note fails here with a clear message instead of inside the upload.
        if: ${{ inputs.play_track != 'none' && inputs.play_track != '' && inputs.release_notes != '' }}
        id: notes
        env:
          NOTES: ${{ inputs.release_notes }}
          LOCALE: ${{ inputs.release_notes_locale }}
        run: |
          set -euo pipefail
          LEN=$(printf '%b' "$NOTES" | wc -m)
          if [ "$LEN" -gt 500 ]; then
            echo "::error title=Play release notes too long::release_notes is $LEN characters; Google Play allows 500 per locale. Shorten it and dispatch again."
            exit 1
          fi
          DIR="$RUNNER_TEMP/whatsnew"
          mkdir -p "$DIR"
          printf '%b\n' "$NOTES" > "$DIR/whatsnew-$LOCALE"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Release notes for $LOCALE ($LEN chars):"
          cat "$DIR/whatsnew-$LOCALE"
      - name: Upload to Play track
        if: ${{ inputs.play_track != 'none' && inputs.play_track != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ runner.temp }}/play.json
          packageName: com.kingjamesbiblereader.twa
          releaseFiles: android/app/build/outputs/bundle/release/kjbreader.aab
          # `tracks` (not the deprecated `track`): one or more comma-separated
          # track names, e.g. production or internal,beta.
          tracks: ${{ inputs.play_track }}
          releaseName: KJBReader.v${{ env.VERSION_NAME }}
          status: ${{ inputs.play_status }}
          # Always submit the committed edit to Google for review (the action
          # would otherwise be able to hold it back with changesNotSentForReview).
          changesNotSentForReview: false
          mappingFile: ${{ steps.deobf.outputs.mapping }}
          # Empty when no release_notes input was given (notes stay unchanged).
          whatsNewDirectory: ${{ steps.notes.outputs.dir }}
      - name: Upload AAB
        uses: actions/upload-artifact@v6
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/kjbreader.aab
