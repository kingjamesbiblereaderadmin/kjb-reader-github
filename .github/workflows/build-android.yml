name: Build Android
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Build web app (bundled into the APK as an offline fallback)
        run: |
          # server.url still makes the app load the LIVE site whenever there's
          # a connection (see capacitor.config.ts) -- this build only exists so
          # cap sync below has something to copy into the APK as a fallback for
          # when there's no connectivity at all. Website updates still don't
          # need an app rebuild for the normal (online) case.
          npm run build
      - name: Sync Capacitor Android (regenerates gitignored native plugin files)
        run: |
          # android/app/src/main/assets is entirely gitignored (public/, capacitor.config.json,
          # capacitor.plugins.json), so a fresh checkout doesn't have the directory at all —
          # cap sync's copy step can't write into a path that doesn't exist yet.
          mkdir -p android/app/src/main/assets
          npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Cache persistence was disabled earlier while misdiagnosing the
          # jars-9/bcprov failure as cache corruption -- it was actually a
          # Gradle 8.2.1 / AGP 8.11.1 version mismatch (see the build step
          # below). Re-enabled now that Gradle is on a compatible version.
          cache-disabled: false
      - name: Kill any stale Gradle daemons
        run: |
          if [ -f android/gradlew ]; then
            android/gradlew --stop || true
          fi
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Generate Gradle wrapper (if missing)
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            echo "No gradlew found — generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.13
          fi
          chmod +x gradlew || true
      - name: Restore persistent release keystore
        run: |
          # Decode the real, persistent signing key from a repo secret instead
          # of generating a throwaway one. This MUST be the same key used for
          # the first Play Store upload, or every update after that is
          # rejected. Add it via: base64 -w0 release.keystore, saved as the
          # ANDROID_KEYSTORE_BASE64 secret.
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$ANDROID_KEYSTORE_PATH"
      - name: Build signed release (APK + AAB)
        working-directory: android
        run: |
          # The "Failed to create Jar file .../jars-9/.../bcprov-*.jar"
          # ("Unsupported class file major version 65") seen here previously
          # was Gradle 8.2.1 unable to parse Java-21 multi-release classes
          # pulled in by AGP 8.11.1, which requires Gradle 8.13+ (see
          # gradle-wrapper.properties). Real fix was the Gradle version bump;
          # the retry below is just a cheap safety net for any other
          # transient CI flakiness, not a fix for that specific error.
          n=0
          until [ $n -ge 3 ]; do
            ./gradlew --stacktrace assembleRelease bundleRelease && break
            n=$((n+1))
            echo "Build attempt $n failed, retrying..."
            ./gradlew --stop || true
            sleep 5
          done
          if [ $n -ge 3 ]; then
            echo "Build failed after 3 attempts"
            exit 1
          fi
      - name: Rename outputs to kjbreader
        working-directory: android
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/kjbreader.apk
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/kjbreader.aab
      - name: Verify signature
        working-directory: android
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose app/build/outputs/apk/release/kjbreader.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/kjbreader.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/kjbreader.aab
