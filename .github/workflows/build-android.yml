name: Build Android
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Sync Capacitor Android (regenerates gitignored native plugin files)
        run: |
          # android/app/src/main/assets is entirely gitignored (public/, capacitor.config.json,
          # capacitor.plugins.json), so a fresh checkout doesn't have the directory at all —
          # cap sync's copy step can't write into a path that doesn't exist yet.
          mkdir -p android/app/src/main/assets
          npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Was restoring the cache from a prior run and then trying to
          # selectively clean out corrupted pieces (see the step below) --
          # but the corruption kept recurring ("Failed to create Jar file
          # .../jars-9/.../bcprov-jdk18on-1.79.jar"), meaning something in the
          # restored cache itself was bad. Disabling persistence entirely
          # means every run starts clean, trading a bit of speed for not
          # inheriting a broken cache.
          cache-disabled: true
      - name: Kill any stale Gradle daemons
        run: |
          if [ -f android/gradlew ]; then
            android/gradlew --stop || true
          fi
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Generate Gradle wrapper (if missing)
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            echo "No gradlew found — generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.13
          fi
          chmod +x gradlew || true
      - name: Restore persistent release keystore
        run: |
          # Decode the real, persistent signing key from a repo secret instead
          # of generating a throwaway one. This MUST be the same key used for
          # the first Play Store upload, or every update after that is
          # rejected. Add it via: base64 -w0 release.keystore, saved as the
          # ANDROID_KEYSTORE_BASE64 secret.
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$ANDROID_KEYSTORE_PATH"
      - name: Build signed release (APK + AAB)
        working-directory: android
        run: |
          # "Failed to create Jar file .../jars-9/.../bcprov-*.jar" leaves a
          # partially-written, corrupted entry behind. Confirmed from a real
          # run's timing: attempt 1 failed in 26s (did real work: download +
          # write), attempts 2 and 3 failed in 4s each -- i.e. they hit the
          # SAME broken file immediately without redoing anything. Stopping
          # the daemon (below) doesn't remove that file, so retries alone were
          # pointless. Delete the specific transform-cache dir before each
          # attempt, and add --stacktrace so if this still fails we get the
          # real underlying cause instead of Gradle's summary line.
          n=0
          until [ $n -ge 3 ]; do
            ./gradlew --stacktrace assembleRelease bundleRelease && break
            n=$((n+1))
            echo "Build attempt $n failed, retrying..."
            ./gradlew --stop || true
            rm -rf ~/.gradle/caches/jars-9
            rm -rf ~/.gradle/caches/*/generated-gradle-jars
            sleep 5
          done
          if [ $n -ge 3 ]; then
            echo "Build failed after 3 attempts"
            exit 1
          fi
      - name: Rename outputs to kjbreader
        working-directory: android
        run: |
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/kjbreader.apk
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/kjbreader.aab
      - name: Verify signature
        working-directory: android
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose app/build/outputs/apk/release/kjbreader.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/kjbreader.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/release/kjbreader.aab
