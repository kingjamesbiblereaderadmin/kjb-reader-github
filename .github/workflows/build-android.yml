name: Build Android
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Sync Capacitor Android (regenerates gitignored native plugin files)
        run: |
          # android/app/src/main/assets is entirely gitignored (public/, capacitor.config.json,
          # capacitor.plugins.json), so a fresh checkout doesn't have the directory at all —
          # cap sync's copy step can't write into a path that doesn't exist yet.
          mkdir -p android/app/src/main/assets
          npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false
     - name: Kill any stale Gradle daemons and clean corrupted cache
       run: |
         if [ -f android/gradlew ]; then
           android/gradlew --stop || true
         fi
         rm -rf ~/.gradle/caches/
         rm -rf ~/.gradle/wrapper/dists/*
