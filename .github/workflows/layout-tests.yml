name: Layout regression tests

# Catches the class of bug we kept re-discovering by hand: RunningHead text
# overlapping "Chapter N", and two-column verse text bleeding across the
# column-rule divider, across every font/zoom/book combination that matters.
# Runs on GitHub's infrastructure (full internet access, unlike the sandbox
# this was originally built in) — no manual rebuild-and-scroll-through-
# screenshots needed. A red X on a PR means don't merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  layout-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run layout regression tests
        run: npm run test:layout
        env:
          CI: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure traces/screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
