name: ASC build list

# Lists the latest builds App Store Connect holds for the app, with
# processing state, so we can verify what actually uploaded.

on:
  workflow_dispatch:

jobs:
  builds:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install pyjwt requests cryptography
      - name: List recent builds
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python scripts/asc-list-builds.py
