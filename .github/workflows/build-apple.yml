name: Build Apple Apps

# Serialize iOS builds: concurrent runs race on the ASC "next build number"
# query (two runs can grab the same number -> altool 90189 Redundant Binary
# Upload) and churn duplicate provisioning requests.
concurrency:
  group: build-apple
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Override the .github/asc-upload-mode repo toggle'
        required: false
        default: 'auto'
        type: choice
        options: [auto, upload, skip]
      platform:
        description: 'Build platform for this run'
        required: false
        default: 'all'
        type: choice
        options: [all, ios, macos]
      build_number:
        description: 'Optional macOS build number (blank = next App Store build number)'
        required: false
        default: ''
        type: string

jobs:
  ios:
    if: inputs.platform != 'macos'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Install deps
        run: npm install
      - name: Build web + sync
        run: npm run build && npx cap sync ios
      - name: Prepare iOS offline bundle
        run: node scripts/prepare-ios-offline.js
      - name: Install pods
        run: cd ios/App && pod install
      - name: Determine next build number (queries ASC, avoids collisions)
        id: nextbuild
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m venv /tmp/ascvenv
          /tmp/ascvenv/bin/pip install pyjwt requests cryptography
          NEXT=$(/tmp/ascvenv/bin/python scripts/asc-next-build.py)
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next build number: $NEXT"

      - name: Write signing key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          if printf '%s' "$ASC_KEY_P8" | head -c 5 | grep -q 'BEGIN'; then
            printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          else
            printf '%s' "$ASC_KEY_P8" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          fi
          jq -n --arg key_id "$ASC_KEY_ID" --arg issuer "$ASC_ISSUER_ID" \
            --rawfile p8 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            '{key_id:$key_id, issuer_id:$issuer, key:$p8, in_house:false}' > ios/ci/asc_key_runtime.json
      # Development signing cannot work here (no registered devices on the
      # account), and `xcodebuild archive` with CODE_SIGNING_ALLOWED=NO does a
      # plain build without creating an .xcarchive. So: build unsigned into a
      # known DerivedData path, then assemble the .xcarchive by hand. The export
      # step below re-signs it with an Apple Distribution certificate + App
      # Store profile created via the ASC API key (-allowProvisioningUpdates).
      - name: Build (unsigned) and assemble xcarchive
        run: |
          set -euxo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/derived \
            CURRENT_PROJECT_VERSION=${{ steps.nextbuild.outputs.next }} \
            MARKETING_VERSION="2.${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          APP=build/derived/Build/Products/Release-iphoneos/App.app
          VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          mkdir -p build/App.xcarchive/Products/Applications
          cp -R "$APP" build/App.xcarchive/Products/Applications/
          ARC=build/App.xcarchive/Products/Applications/App.app
          # The unsigned build embeds no entitlements, and -exportArchive takes
          # entitlements from the archive's existing signature — so without
          # this step the exported IPA is signed with EMPTY entitlements and
          # the App Group (share-sheet hand-off) silently goes missing.
          # Ad-hoc signing the bundles here embeds each target's entitlements;
          # the export step then re-signs with the distribution identity while
          # preserving them. If the profile can't cover the App Group, export
          # fails loudly here instead of shipping a broken share extension.
          codesign --force --sign - --entitlements ios/App/App/App.entitlements "$ARC"
          codesign --force --sign - --entitlements ios/App/Share/KJBShare.entitlements "$ARC/PlugIns/KJBShare.appex"
          cat > build/App.xcarchive/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>ApplicationProperties</key>
            <dict>
              <key>ApplicationPath</key><string>Applications/App.app</string>
              <key>CFBundleIdentifier</key><string>com.kingjamesbiblereader.twa</string>
              <key>CFBundleShortVersionString</key><string>$VER</string>
              <key>CFBundleVersion</key><string>$BUILD</string>
              <key>SigningIdentity</key><string></string>
              <key>Team</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            </dict>
            <key>ArchiveVersion</key><integer>2</integer>
            <key>CreationDate</key><date>$(date -u +%Y-%m-%dT%H:%M:%SZ)</date>
            <key>Name</key><string>App</string>
            <key>SchemeName</key><string>App</string>
            <key>Project</key><dict><key>Name</key><string>App</string></dict>
          </dict>
          </plist>
          EOF
          find build/App.xcarchive -maxdepth 3
      - name: Generate export options (with team ID)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed 's|</dict>|<key>teamID</key><string>'"$APPLE_TEAM_ID"'</string></dict>|' ios/ci/ExportOptions.plist > ios/ci/ExportOptions-runtime.plist
          plutil -lint ios/ci/ExportOptions-runtime.plist
      - name: Ensure App Group capability (diagnose export auth failures)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: /tmp/ascvenv/bin/python scripts/asc-ensure-app-groups.py
      - name: Export IPA (signs with Apple Distribution)
        run: |
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist ios/ci/ExportOptions-runtime.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
      # The archive is assembled by hand from an unsigned build, so confirm the
      # signed IPA really carries the share extension and the App Group
      # entitlement on both the app and the extension. A missing extension fails
      # the job before upload; a missing App Group is reported as a warning.
      - name: Verify share extension in IPA
        run: |
          set -u
          rm -rf /tmp/ipacheck && mkdir -p /tmp/ipacheck
          unzip -q build/ipa/App.ipa -d /tmp/ipacheck
          APP=/tmp/ipacheck/Payload/App.app
          APPEX="$APP/PlugIns/KJBShare.appex"
          GROUP=group.com.kingjamesbiblereader.twa
          {
            echo "### Share extension check"
            echo "PlugIns contents:"; ls -1 "$APP/PlugIns" 2>&1 | sed 's/^/- /'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ ! -d "$APPEX" ]; then
            echo "::error::KJBShare.appex is missing from the IPA - the share sheet entry would not ship"
            exit 1
          fi
          PB=/usr/libexec/PlistBuddy
          {
            echo "- extension display name: $($PB -c 'Print :CFBundleDisplayName' "$APPEX/Info.plist")"
            echo "- app version/build: $($PB -c 'Print :CFBundleShortVersionString' "$APP/Info.plist") ($($PB -c 'Print :CFBundleVersion' "$APP/Info.plist"))"
            echo "- extension version/build: $($PB -c 'Print :CFBundleShortVersionString' "$APPEX/Info.plist") ($($PB -c 'Print :CFBundleVersion' "$APPEX/Info.plist"))"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for T in "$APP" "$APPEX"; do
            ENT="$(codesign -d --entitlements :- "$T" 2>/dev/null || codesign -d --xml --entitlements - "$T" 2>/dev/null || true)"
            if printf '%s' "$ENT" | grep -q "$GROUP"; then
              echo "- $(basename "$T"): App Group entitlement present" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$(basename "$T") is missing the $GROUP entitlement - the share sheet 'Look up' hand-off would silently do nothing"
              echo "- $(basename "$T"): App Group entitlement MISSING" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          SV="$APP/public/__native/spotlight-verses.json"
          if [ -f "$SV" ]; then
            echo "::error::spotlight-verses.json is in the IPA - per-verse Spotlight rows were removed; delete the stale file and the prepare step that generates it"
            exit 1
          else
            echo "- spotlight-verses.json: absent (per-verse Spotlight rows removed by design)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Resolve upload mode
        id: uploadmode
        run: |
          MODE="$(head -1 .github/asc-upload-mode 2>/dev/null | tr -d '[:space:]')"
          DISPATCH="${{ inputs.upload }}"
          if [ "$DISPATCH" = "upload" ] || [ "$DISPATCH" = "skip" ]; then
            MODE="$DISPATCH"
          fi
          echo "Repo toggle: $(head -1 .github/asc-upload-mode 2>/dev/null || echo '<missing>'); dispatch input: $DISPATCH -> mode=$MODE"
          if [ "$MODE" = "skip" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Upload mode: SKIP (build-only run)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Upload mode: UPLOAD"
          fi
      - name: Upload to App Store Connect
        if: steps.uploadmode.outputs.skip != 'true'
        run: |
          # Keep fastlane's output and surface the reason as a run annotation +
          # job summary, so a failed upload can be diagnosed from the run page
          # (annotations are readable without opening the raw log).
          set +e
          fastlane deliver --api_key_path ios/ci/asc_key_runtime.json --ipa build/ipa/App.ipa --skip_screenshots --skip_metadata --run_precheck_before_submit false 2>&1 | tee /tmp/deliver.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            REASON="$(tail -18 /tmp/deliver.log | sed 's/\x1b\[[0-9;]*m//g' | tr '\n' '|' | cut -c1-2000)"
            echo "::error title=ASC upload failed (fastlane exit $rc)::${REASON}"
            {
              echo "### ASC upload failed (exit $rc)"
              echo '```'
              tail -40 /tmp/deliver.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc
      - name: Upload skipped (build-only)
        if: steps.uploadmode.outputs.skip == 'true'
        run: echo "Skipped the App Store Connect upload per .github/asc-upload-mode (or the dispatch input). The build+export still validated this commit."
  macos:
    if: inputs.platform != 'ios'
    runs-on: macos-26
    env:
      APP_NAME: KJB Reader
      BUNDLE_ID: com.kingjamesbiblereader.twa

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web app and sync Capacitor
        run: npm run build && npx cap sync ios

      - name: Install CocoaPods
        run: cd ios/App && pod install

      - name: Determine build number
        id: nextbuild
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.build_number }}" ]; then
            NEXT="${{ inputs.build_number }}"
          else
            python3 -m venv /tmp/ascvenv
            /tmp/ascvenv/bin/pip install pyjwt requests cryptography
            NEXT=$(/tmp/ascvenv/bin/python scripts/asc-next-build.py)
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "macOS build number: $NEXT"

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          if printf '%s' "$ASC_KEY_P8" | head -c 5 | grep -q 'BEGIN'; then
            printf '%s\n' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          fi

      - name: Resolve main KJB Reader App Store app ID
        id: ascapp
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP_ID=$(/tmp/ascvenv/bin/python - <<'PYAPP'
          import os, time, jwt, requests
          key_path = os.path.expanduser("~/.appstoreconnect/private_keys/AuthKey_" + os.environ["ASC_KEY_ID"] + ".p8")
          key = open(key_path).read()
          token = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 900, "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"]})
          r = requests.get("https://api.appstoreconnect.apple.com/v1/apps", params={"filter[bundleId]": "com.kingjamesbiblereader.twa", "limit": 10}, headers={"Authorization": "Bearer " + token})
          r.raise_for_status()
          apps = r.json().get("data", [])
          if len(apps) != 1:
              raise SystemExit(f"Expected exactly one main KJB Reader app, found {len(apps)}")
          print(apps[0]["id"])
          PYAPP
          )
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "Main KJB Reader App Store ID: $APP_ID"

      - name: Apply macOS entitlements for this build
        run: |
          set -euo pipefail
          cp ios/App/App/App-mac.entitlements ios/App/App/App.entitlements
          cp ios/App/Share/KJBShare-mac.entitlements ios/App/Share/KJBShare.entitlements

      - name: Build unsigned macOS archive
        env:
          BUILD_NUMBER: ${{ steps.nextbuild.outputs.next }}
        run: |
          set -euxo pipefail
          rm -rf build/macos build/derived-macos
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -archivePath build/macos/KJB-Reader.xcarchive \
            -derivedDataPath build/derived-macos \
            -sdk macosx \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID '${{ secrets.ASC_KEY_ID }}' \
            -authenticationKeyIssuerID '${{ secrets.ASC_ISSUER_ID }}' \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="2.${{ github.run_number }}" \
            SUPPORTS_MACCATALYST=YES \
            TARGETED_DEVICE_FAMILY="1,2,6" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Embed macOS App Sandbox entitlements in archive
        run: |
          set -euo pipefail
          APP=build/macos/KJB-Reader.xcarchive/Products/Applications/App.app
          EXT="$APP/PlugIns/KJBShare.appex"
          test -d "$APP"
          test -d "$EXT"
          # The archive is intentionally built unsigned. Embed the macOS
          # entitlements before export so exportArchive preserves them when
          # it applies the App Store distribution signature.
          codesign --force --deep --sign - --timestamp=none \
            --entitlements ios/App/Share/KJBShare-mac.entitlements "$EXT" 2>&1
          codesign --force --deep --sign - --timestamp=none \
            --entitlements ios/App/App/App-mac.entitlements "$APP" 2>&1
          echo '--- signed app entitlements ---'
          codesign -d --entitlements :- "$APP" 2>&1 || true
          echo '--- signed extension entitlements ---'
          codesign -d --entitlements :- "$EXT" 2>&1 || true

      - name: Export signed macOS package
        if: inputs.upload == 'upload'
        env:
          BUILD_NUMBER: ${{ steps.nextbuild.outputs.next }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euxo pipefail
          mkdir -p build/macos-export
          cat > build/macos-export/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/macos/KJB-Reader.xcarchive \
            -exportPath build/macos-export \
            -exportOptionsPlist build/macos-export/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" \
            -authenticationKeyID '${{ secrets.ASC_KEY_ID }}' \
            -authenticationKeyIssuerID '${{ secrets.ASC_ISSUER_ID }}'
          find build/macos-export -maxdepth 2 -type f -print

      - name: Upload macOS package to App Store Connect
        if: inputs.upload == 'upload'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euxo pipefail
          PKG=$(find build/macos-export -maxdepth 1 -type f \( -name '*.pkg' -o -name '*.zip' \) | head -1)
          test -n "$PKG"
          xcrun altool --upload-package "$PKG" \
            --type macos \
            --apple-id "${{ steps.ascapp.outputs.app_id }}" \
            --bundle-id "$BUNDLE_ID" \
            --bundle-version "${{ steps.nextbuild.outputs.next }}" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: KJB-Reader-macOS
          path: |
            build/macos-export/*
            build/macos/KJB-Reader.xcarchive
          if-no-files-found: warn
          retention-days: 14

